<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Demo</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 13px/1.6 system-ui, sans-serif; color: #1f2937; background: transparent; }
    .card { border: 1px solid #d1d5db; border-radius: 8px; padding: 12px 14px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grow { flex: 1; }
    code { font-family: ui-monospace, monospace; }
    button { border: 1px solid #6b7280; background: transparent; color: inherit; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { color: #e5e7eb; }
      .card { border-color: #4b5563; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <b>🧩 UI Demo</b>
      <span class="grow"></span>
      <span id="slot" class="muted"></span>
    </div>
    <div id="context" style="opacity:.75;margin-top:4px">等待宿主上下文…</div>
    <div class="row" style="margin-top:8px">
      <button id="notify">发送通知</button>
      <button id="open">打开项目列表</button>
      <button id="grow">加高</button>
    </div>
  </div>
  <script>
    let context = {};
    let height = 180;
    const post = (msg) => parent.postMessage(msg, '*');
    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type !== 'xissue:context') return;
      context = data.context || {};
      document.getElementById('slot').textContent = data.slot ? `slot: ${data.slot}` : '独立页面';
      document.getElementById('context').textContent = JSON.stringify(context);
    });
    document.getElementById('notify').onclick = () => post({ type: 'xissue:notify', kind: 'success', message: '来自插件 UI 的通知' });
    document.getElementById('open').onclick = () => post({ type: 'xissue:open', path: '/' });
    document.getElementById('grow').onclick = () => {
      height = height >= 360 ? 180 : height + 90;
      post({ type: 'xissue:resize', height });
    };
    post({ type: 'xissue:ready' });
  </script>
</body>
</html>
