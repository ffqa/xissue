<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-x" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners and modern border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#grad-bg)" stroke="#313244" stroke-width="1.5"/>
  <!-- Glowing X / Issue Orchestration nodes -->
  <g filter="url(#glow)">
    <!-- Main branch lines -->
    <line x1="17" y1="17" x2="47" y2="47" stroke="url(#grad-x)" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="47" y1="17" x2="17" y2="47" stroke="url(#grad-x)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Center agent pulse node -->
    <circle cx="32" cy="32" r="5.5" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
    <!-- Multi-repo / Branch branch nodes -->
    <circle cx="17" cy="17" r="3.5" fill="#38bdf8"/>
    <circle cx="47" cy="17" r="3.5" fill="#a855f7"/>
    <circle cx="17" cy="47" r="3.5" fill="#a855f7"/>
    <circle cx="47" cy="47" r="3.5" fill="#38bdf8"/>
  </g>
</svg>
